apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llama-server.fullname" . }}
  labels:
    {{- include "llama-server.labels" . | nindent 4 }}
data:
  LLAMA_ARG_THREADS: {{ .Values.llama.threads | quote }}
  LLAMA_ARG_N_PARALLEL: {{ .Values.llama.parallel | quote }}
  LLAMA_ARG_CTX_SIZE: {{ .Values.llama.ctxSize | quote }}
  LLAMA_ARG_CONT_BATCHING: {{ ternary "1" "0" .Values.llama.contBatching | quote }}
  LLAMA_ARG_UI: {{ ternary "1" "0" .Values.llama.webui | quote }}
  LLAMA_ARG_ENDPOINT_METRICS: "1"
  LLAMA_ARG_HOST: "0.0.0.0"
  LLAMA_ARG_PORT: {{ .Values.service.port | quote }}
