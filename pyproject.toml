[project]
name = "sllmbench"
version = "0.1.0"
description = "llama-server on Kubernetes 측정 수집기와 리포트 생성기"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
sllmbench-collect = "sllmbench.collect:main"
sllmbench-report = "sllmbench.report:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sllmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
